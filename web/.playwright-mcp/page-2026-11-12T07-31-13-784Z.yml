      - heading "ความสัมพันธ์แบบเข้าใจง่าย" [level=2] [ref=e159]
      - list [ref=e160]:
        - listitem [ref=e161]: หมวดหนึ่งมีเครื่องดื่มได้หลายเมนู (หรือยังไม่มีเลย) แต่ทุกเมนูต้องอยู่ในหมวดหนึ่ง โดยอ้างชื่อหมวด ไม่ใช่รหัสหมวด
        - listitem [ref=e162]: เครื่องดื่มหนึ่งเมนูถูกสั่งได้หลายออเดอร์ (หรือยังไม่ถูกสั่ง) แต่ออเดอร์แต่ละรายการอ้างถึงเมนูเดียวและเก็บจำนวนแก้วไว้ในรายการนั้น
        - listitem [ref=e163]:
          - text: เปลี่ยนค่าคีย์ที่ถูกอ้างอิงแล้ว FK จะเปลี่ยนตาม (
          - code [ref=e164]: ON UPDATE CASCADE
          - text: ); ลบหมวดหรือเมนูที่ยังมีรายการลูกไม่ได้ (
          - code [ref=e165]: ON DELETE RESTRICT
          - text: )
        - listitem [ref=e166]:
          - text: ทุกตารางเป็น SQLite
          - code [ref=e167]: STRICT
          - text: และ
          - code [ref=e168]: PRAGMA foreign_keys = ON
          - text: เปิดการตรวจ FK ในสคริปต์ schema
