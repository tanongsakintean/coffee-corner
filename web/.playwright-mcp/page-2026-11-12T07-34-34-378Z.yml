      - heading "ความสัมพันธ์แบบเข้าใจง่าย" [level=2] [ref=f3e159]
      - list [ref=f3e160]:
        - listitem [ref=f3e161]: หมวดหนึ่งมีเครื่องดื่มได้หลายเมนู (หรือยังไม่มีเลย) แต่ทุกเมนูต้องอยู่ในหมวดหนึ่ง โดยอ้างชื่อหมวด ไม่ใช่รหัสหมวด
        - listitem [ref=f3e162]: เครื่องดื่มหนึ่งเมนูถูกสั่งได้หลายออเดอร์ (หรือยังไม่ถูกสั่ง) แต่ออเดอร์แต่ละรายการอ้างถึงเมนูเดียวและเก็บจำนวนแก้วไว้ในรายการนั้น
        - listitem [ref=f3e163]:
          - text: เปลี่ยนค่าคีย์ที่ถูกอ้างอิงแล้ว FK จะเปลี่ยนตาม (
          - code [ref=f3e164]: ON UPDATE CASCADE
          - text: ); ลบหมวดหรือเมนูที่ยังมีรายการลูกไม่ได้ (
          - code [ref=f3e165]: ON DELETE RESTRICT
          - text: )
        - listitem [ref=f3e166]:
          - text: ทุกตารางเป็น SQLite
          - code [ref=f3e167]: STRICT
          - text: และ
          - code [ref=f3e168]: PRAGMA foreign_keys = ON
          - text: เปิดการตรวจ FK ในสคริปต์ schema
